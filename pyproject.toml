[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "randomizer"
version = "0.1.0"
description = "Reproducible simple, block and stratified randomization for experiment allocation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
randomizer = "randomizer.cli:main"

[tool.setuptools]
packages = ["randomizer"]
